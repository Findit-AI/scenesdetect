[package]
name = "scenesdetect"
version = "0.3.1"
edition = "2024"
repository = "https://github.com/findit-studio/scenesdetect"
homepage = "https://github.com/findit-studio/scenesdetect"
documentation = "https://docs.rs/scenesdetect"
description = "Scene/shot cut detection ported from PySceneDetect — Sans-I/O streaming API with SIMD-accelerated detectors for histogram, pHash, threshold, content, and adaptive algorithms."
license = "MIT OR Apache-2.0"
rust-version = "1.95.0"

[[bench]]
path = "benches/histogram.rs"
name = "histogram"
harness = false

[[bench]]
path = "benches/phash.rs"
name = "phash"
harness = false

[[bench]]
path = "benches/threshold.rs"
name = "threshold"
harness = false

[[bench]]
path = "benches/content.rs"
name = "content"
harness = false

[[bench]]
path = "benches/adaptive.rs"
name = "adaptive"
harness = false

[features]
default = ["std"]
alloc = ["libm", "dep:fast_image_resize", "fast_image_resize/no_std"]
std = ["thiserror/default", "dep:fast_image_resize", "fast_image_resize/std"]

serde = ["dep:serde", "dep:humantime-serde", "bitflags/serde"]
mediaframe = [
  "alloc",
  "dep:half",
  "dep:mediaframe",
  "mediaframe/rgb",
  "mediaframe/rgb-float",
  "mediaframe/rgb-legacy",
]

[dependencies]
derive_more = { version = "2", default-features = false, features = ["is_variant", "display"] }
thiserror = { version = "2", default-features = false }

# mediatime 0.1.5 dropped the `Option<Duration>` from
# `TimeRange::duration` in favour of a bare `Duration`, with
# `TimeRange::new` panicking on `end < start` (and
# `TimeRange::try_new` as the fallible variant). `Detector::
# finalize_shot` now short-circuits on `duration.is_zero()`
# instead of the old `None` arm.
#
# 0.2 signed `Timebase`'s numerator and denominator (`u32`/`NonZeroU32`
# → `i32`/`NonZeroI32`) to match ffmpeg's `AVRational`. 0.3 deleted the
# bare-name arithmetic — `duration_to_pts` and `frames_to_duration` are
# now `checked_`/`saturating_` rungs, the latter on the new `Rate` type
# — and corrected the rounding to nearest-with-ties-away-from-zero
# (`AV_ROUND_NEAR_INF`), which the truncating docs had claimed all
# along.
mediatime = { version = "0.3", default-features = false }

libm = { version = "0.2", optional = true, default-features = false }

# Gated on `alloc` or `std`: the only consumer is `keyframe::preprocess::Downscaler`,
# which itself only compiles under `alloc`/`std` (see `lib.rs`). Pulling
# `fast_image_resize` in unconditionally breaks `cargo check
# --no-default-features` because the dependency's own build requires one of
# its float feature flags.
fast_image_resize = { version = "6", default-features = false, optional = true }

half = { version = "2", optional = true, default-features = false }
mediaframe = { version = "0.5", optional = true, default-features = false }

serde = { version = "1", default-features = false, features = [
  "derive",
], optional = true }
humantime-serde = { version = "1", default-features = false, optional = true }
bitflags = { version = "2", default-features = false }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"
# JSON form used in `#[cfg(feature = "serde")]` round-trip tests
# (forward-compat checks for legacy payloads that predate newer
# Options fields). Test-only — not pulled into library builds.
serde_json = "1"

[profile.bench]
opt-level = 3
debug = false
codegen-units = 1
lto = 'thin'
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace.lints.rust]
rust_2018_idioms = "warn"
single_use_lifetimes = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
] }
